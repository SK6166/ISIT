# ============================================================
# База правил экспертной системы PX4 PID
# Формат условия: [переменная, оператор, значение]
# Операторы: "=", "!=", "in" (значение — список)
# Тип вывода:
#   recommendation — конкретная рекомендация
#   refusal        — отказ от настройки
#   question       — уточняющий вопрос (система не может решить)
#   final_question — вопрос перед финальной рекомендацией
# ============================================================

variables:
  ось_проблемы:
    question: "Укажите ось, на которой проявляется проблема"
    options: ["roll", "pitch", "yaw", "неизвестно"]
  симптом_высокочастотные_колебания:
    question: "Наблюдаются высокочастотные колебания (дрожь) аппарата?"
    options: ["да", "нет", "неизвестно"]
  симптом_медленная_реакция:
    question: "Аппарат медленно реагирует на команды по стику?"
    options: ["да", "нет", "неизвестно"]
  симптом_перерегулирование:
    question: "Есть перерегулирование после резкого стика (проскакивает и возвращается)?"
    options: ["да", "нет", "неизвестно"]
  симптом_дёрганость_моторов:
    question: "Моторы 'дёргаются', слышен треск или они перегреваются?"
    options: ["да", "нет", "неизвестно"]
  симптом_медленные_колебания:
    question: "Наблюдаются медленные колебания (раскачивание с периодом ~1–2 с)?"
    options: ["да", "нет", "неизвестно"]
  симптом_дрейф_в_Acro:
    question: "В режиме Acro при удержании стика аппарат медленно возвращается/дрейфует?"
    options: ["да", "нет", "неизвестно"]
  режим_полёта:
    question: "В каком режиме полёта наблюдается проблема?"
    options: ["Acro", "Stabilized", "Position", "неизвестно"]
  airmode_отключен:
    question: "Отключён ли параметр MC_AIRMODE перед настройкой?"
    options: ["да", "нет", "неизвестно"]
  thrust_curve_установлен:
    question: "Установлен ли Thrust Curve (0.3 для PWM ESC / 1 для RPM-based)?"
    options: ["да", "нет", "неизвестно"]
  rate_controller_настроен:
    question: "Был ли уже настроен Rate Controller (P/D/I по осям)?"
    options: ["да", "нет", "неизвестно"]
  уровень_вибраций:
    question: "Уровень вибраций по логам (QGC → Analyze → Logs): низкий / средний / высокий?"
    options: ["низкий", "средний", "высокий", "неизвестно"]
  уверенность_диагноза:
    question: "Насколько вы уверены в наблюдениях? (высокая / низкая)"
    options: ["высокая", "низкая", "неизвестно"]

rules:
  # ---------- Ограничения и предварительные проверки ----------
  - id: R-01
    if:
      - ["airmode_отключен", "=", "нет"]
    then:
      type: refusal
      text: "Отказ от настройки: сначала отключите MC_AIRMODE (установите 0), выполните повторный тест и вернитесь к настройке."
    source: K-09
    priority: 100

  - id: R-02
    if:
      - ["thrust_curve_установлен", "=", "нет"]
    then:
      type: refusal
      text: "Отказ от настройки: установите Thrust Curve (0.3 для PWM ESC или 1 для RPM-based ESC) и повторите тест."
    source: K-09
    priority: 99

  - id: R-03
    if:
      - ["rate_controller_настроен", "=", "нет"]
      - ["ось_проблемы", "in", ["roll", "pitch"]]
    then:
      type: refusal
      text: "Отказ: сначала настройте Rate Controller (P → D → I), затем Attitude Controller (MC_ROLL_P / MC_PITCH_P)."
    source: K-08
    priority: 98

  # ---------- P-коэффициент ----------
  - id: R-04
    if:
      - ["симптом_высокочастотные_колебания", "=", "да"]
      - ["ось_проблемы", "=", "roll"]
    then:
      type: recommendation
      text: "Уменьшить MC_ROLLRATE_P на 20–30% и повторить тест в Acro mode."
    source: K-01
    priority: 90

  - id: R-05
    if:
      - ["симптом_высокочастотные_колебания", "=", "да"]
      - ["ось_проблемы", "=", "pitch"]
    then:
      type: recommendation
      text: "Уменьшить MC_PITCHRATE_P на 20–30% и повторить тест в Acro mode."
    source: K-01
    priority: 90

  - id: R-06
    if:
      - ["симптом_медленная_реакция", "=", "да"]
      - ["ось_проблемы", "=", "roll"]
    then:
      type: recommendation
      text: "Увеличить MC_ROLLRATE_P шагами по 10% до появления быстрой реакции без перерегулирования."
    source: K-02
    priority: 85

  - id: R-07
    if:
      - ["симптом_медленная_реакция", "=", "да"]
      - ["ось_проблемы", "=", "pitch"]
    then:
      type: recommendation
      text: "Увеличить MC_PITCHRATE_P шагами по 10% до появления быстрой реакции без перерегулирования."
    source: K-02
    priority: 85

  # ---------- D-коэффициент ----------
  - id: R-08
    if:
      - ["симптом_дёрганость_моторов", "=", "да"]
      - ["ось_проблемы", "=", "roll"]
    then:
      type: recommendation
      text: "Уменьшить MC_ROLLRATE_D (шаг 10–20%): высокий D усиливает шум и перегревает моторы."
    source: K-03
    priority: 88

  - id: R-09
    if:
      - ["симптом_дёрганость_моторов", "=", "да"]
      - ["ось_проблемы", "=", "pitch"]
    then:
      type: recommendation
      text: "Уменьшить MC_PITCHRATE_D (шаг 10–20%): высокий D усиливает шум и перегревает моторы."
    source: K-03
    priority: 88

  - id: R-10
    if:
      - ["симптом_перерегулирование", "=", "да"]
      - ["ось_проблемы", "=", "roll"]
    then:
      type: recommendation
      text: "Увеличить MC_ROLLRATE_D шагами по 10% до устранения перерегулирования."
    source: K-04
    priority: 70

  - id: R-11
    if:
      - ["симптом_перерегулирование", "=", "да"]
      - ["ось_проблемы", "=", "pitch"]
    then:
      type: recommendation
      text: "Увеличить MC_PITCHRATE_D шагами по 10% до устранения перерегулирования."
    source: K-04
    priority: 70

  # ---------- I-коэффициент ----------
  - id: R-12
    if:
      - ["симптом_медленные_колебания", "=", "да"]
    then:
      type: recommendation
      text: "Уменьшить MC_ROLLRATE_I и MC_PITCHRATE_I (шаг 10–20%): высокий I даёт медленные колебания."
    source: K-05
    priority: 80

  - id: R-13
    if:
      - ["симптом_дрейф_в_Acro", "=", "да"]
      - ["режим_полёта", "=", "Acro"]
    then:
      type: recommendation
      text: "Увеличить MC_ROLLRATE_I и MC_PITCHRATE_I шагами по 10–20% до устранения дрейфа в Acro."
    source: K-06
    priority: 60

  # ---------- Attitude Controller ----------
  - id: R-14
    if:
      - ["симптом_высокочастотные_колебания", "=", "да"]
      - ["ось_проблемы", "in", ["roll", "pitch"]]
      - ["rate_controller_настроен", "=", "да"]
      - ["симптом_дёрганость_моторов", "=", "нет"]
    then:
      type: recommendation
      text: "Если Rate Controller настроен и стабилен, уменьшить MC_ROLL_P / MC_PITCH_P на 10% (Attitude Controller)."
    source: K-07
    priority: 40

  - id: R-15
    if:
      - ["ось_проблемы", "=", "yaw"]
      - ["симптом_высокочастотные_колебания", "=", "да"]
    then:
      type: recommendation
      text: "Уменьшить MC_YAWRATE_P на 20–30%: по yaw D-коэффициент обычно не используется."
    source: K-01
    priority: 65

  # ---------- Уточнение / конфликты ----------
  - id: R-16
    if:
      - ["симптом_дёрганость_моторов", "=", "да"]
      - ["симптом_перерегулирование", "=", "да"]
    then:
      type: final_question
      text: "Конфликт: одновременно нужен рост D (перерегулирование) и снижение D (дёрганость). Проверьте уровень вибраций:"
      ask_variable: уровень_вибраций
    source: "модельное допущение"
    priority: 95

  - id: R-17
    if:
      - ["уровень_вибраций", "=", "высокий"]
    then:
      type: recommendation
      text: "Высокие вибрации — сначала уменьшите D или установите gyro-фильтры (IMU_GYRO_CUTOFF), затем повторяйте настройку PID."
    source: K-03
    priority: 97

  - id: R-18
    if:
      - ["уровень_вибраций", "=", "низкий"]
      - ["симптом_перерегулирование", "=", "да"]
    then:
      type: recommendation
      text: "Вибрации низкие, значит D можно увеличивать: начните с +10% MC_ROLLRATE_D / MC_PITCHRATE_D."
    source: K-04
    priority: 75

  - id: R-19
    if:
      - ["симптом_высокочастотные_колебания", "=", "неизвестно"]
      - ["симптом_медленная_реакция", "=", "неизвестно"]
      - ["симптом_перерегулирование", "=", "неизвестно"]
    then:
      type: question
      text: "Недостаточно данных для диагностики: опишите поведение аппарата (быстрый/медленный отклик, дрожь, перерегулирование)."
    source: "модельное допущение"
    priority: 96

  - id: R-20
    if:
      - ["уверенность_диагноза", "=", "низкая"]
      - ["симптом_высокочастотные_колебания", "=", "да"]
      - ["симптом_медленная_реакция", "=", "да"]
    then:
      type: recommendation
      text: "Противоречивые симптомы и низкая уверенность: запустите Autotune из QGC (Vehicle Setup → PID Tuning → Autotune) вместо ручной настройки."
    source: "модельное допущение"
    priority: 50

  - id: R-21
    if:
      - ["режим_полёта", "=", "неизвестно"]
      - ["симптом_дрейф_в_Acro", "=", "да"]
    then:
      type: question
      text: "Для диагностики дрейфа нужен режим полёта. Уточните: проблема в Acro или в Stabilized/Position?"
    source: K-08
    priority: 92
